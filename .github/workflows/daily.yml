name: Daily Stock Analysis

on:
  schedule:
    # 毎日 日本時間 朝8:30 (UTC 23:30) に実行
    - cron: '30 23 * * *'
  workflow_dispatch: # 手動で実行ボタンを押すことも可能にする

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run analysis
        run: python main.py
